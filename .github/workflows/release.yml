name: Release theme

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - komari-theme.json
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-theme
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve version
        id: theme
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('komari-theme.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable semantic version.');
          const tag = `v${version}`;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== tag) {
            throw new Error('Tag must match komari-theme.json version.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish installable theme
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THEME_VERSION: ${{ steps.theme.outputs.version }}
          RELEASE_TAG: ${{ steps.theme.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json url --jq .url; then
            echo "::notice::Release already exists; update the theme version to publish a new package."
            exit 0
          fi
          if tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag points to a different commit; release was not published."
              exit 1
            fi
          fi
          cat > release-notes.md <<EOF
          下载 **komari-endfield-$THEME_VERSION.zip**，在 Komari 后台的主题管理中上传并应用。

          - 网络页新增最近 24 小时上传／下载图表，支持累计与速率切换、鼠标和键盘查看采样。
          - 实时带宽下新增流量消耗 Top 3，按上传＋下载排序，点击可查看主机详情。
          - 流量按可见主机的历史增量汇总，保留缺失记录，并处理计数器重置和采集间断；旧后端不支持时明确提示。
          - 统一三页、主机详情和设置的字号、表头、配色与控件状态，提高浅色文字及仪表细线对比度。
          - 精简重复边框与设置背景纹理，优化手机详情、长图例换行、键盘焦点和减少动态效果。
          - 整理 README，保留安装、更新、功能、开发与发布说明。
          - 91 项自动测试通过，附带 SHA-256 校验文件。

          请使用上面的主题 ZIP；GitHub 自动生成的 Source code 压缩包不包含构建产物，无法直接安装。
          EOF
          gh release create "$RELEASE_TAG" \
            "release/komari-endfield-$THEME_VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Endfield v$THEME_VERSION" \
            --notes-file release-notes.md \
            --latest
          gh release upload "$RELEASE_TAG" "release/komari-endfield-$THEME_VERSION.zip.sha256"
