name: Release theme

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - komari-theme.json
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-theme
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve version
        id: theme
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('komari-theme.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable semantic version.');
          const tag = `v${version}`;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== tag) {
            throw new Error('Tag must match komari-theme.json version.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish installable theme
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THEME_VERSION: ${{ steps.theme.outputs.version }}
          RELEASE_TAG: ${{ steps.theme.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json url --jq .url; then
            echo "::notice::Release already exists; update the theme version to publish a new package."
            exit 0
          fi
          if tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag points to a different commit; release was not published."
              exit 1
            fi
          fi
          cat > release-notes.md <<EOF
          下载 **komari-endfield-$THEME_VERSION.zip**，在 Komari 后台的主题管理中上传并应用。

          - 重绘总览仪表：分层刻度、在线率指针、节点状态扇区与慢速机械动效；四角框保持固定，只有内部跟随鼠标偏转。
          - 重绘交互地球的点阵、刻度及标注，移除赤道实线与虚线；保留单轴旋转、地区定位和同步缩放。
          - 新增随机在线节点间的动态流量示意，仅显示移动光点与短尾迹；支持特效开关、发送间隔和单路／多台并发。
          - 新增独立交互地球配置页，支持后台默认值与浏览器偏好；多台并发按每台主机独立计时。
          - 重新设计主机列表及全局按钮，统一切角、明暗配色、状态边框、悬停填充与移动端布局。
          - 保留三页独立列表／卡片配置、主机到期信息、多测试点延迟曲线和可中断页面切换。
          - 自动测试增至 80 项，覆盖流量路径、调度与动画清理。
          - 附带 SHA-256 校验文件。

          请使用上面的主题 ZIP；GitHub 自动生成的 Source code 压缩包不包含构建产物，无法直接安装。
          EOF
          gh release create "$RELEASE_TAG" \
            "release/komari-endfield-$THEME_VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Endfield v$THEME_VERSION" \
            --notes-file release-notes.md \
            --latest
          gh release upload "$RELEASE_TAG" "release/komari-endfield-$THEME_VERSION.zip.sha256"
